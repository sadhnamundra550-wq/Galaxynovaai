
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Galaxy Nova AI</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #101820;
    color: white;
    height: 100vh;
    display: flex;
    overflow: hidden;
}

/* SIDEBAR */

.sidebar {
    width: 260px;
    min-width: 260px;
    background: #172832;
    border-right: 1px solid #30434c;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.logo {
    font-size: 24px;
    font-weight: bold;
    color: #42d392;
    margin-bottom: 15px;
}

.new-chat,
.webkit-btn {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: bold;
    text-align: left;
    text-decoration: none;
    display: block;
    cursor: pointer;
    transition: 0.2s;
}

.new-chat {
    background: #247b65;
    color: white;
}

.webkit-btn {
    background: #174f80;
    color: white;
}

.new-chat:hover {
    background: #31977b;
}

.webkit-btn:hover {
    background: #226da8;
}

.sidebar-info {
    margin-top: auto;
    color: #8da5ad;
    font-size: 12px;
    line-height: 1.6;
}

/* MAIN AREA */

.main {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
}

header {
    height: 65px;
    min-height: 65px;
    padding: 20px;
    background: #172832;
    border-bottom: 1px solid #30434c;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.header-title {
    font-size: 19px;
    font-weight: bold;
}

.model-status {
    font-size: 12px;
    color: #42d392;
}

/* CHAT */

#chat {
    flex: 1;
    overflow-y: auto;
    padding: 25px;
}

.welcome {
    text-align: center;
    margin: 15vh auto 0;
    max-width: 500px;
    color: #c1d2d8;
}

.welcome h1 {
    color: #42d392;
    font-size: 32px;
    margin-bottom: 12px;
}

.welcome p {
    font-size: 15px;
    line-height: 1.6;
}

.message {
    padding: 14px 17px;
    border-radius: 13px;
    margin-bottom: 18px;
    max-width: 85%;
    line-height: 1.7;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.user {
    background: #176b58;
    margin-left: auto;
}

.ai {
    background: #263944;
    margin-right: auto;
}

.error {
    background: #572b35;
    color: #ffd5dc;
}

/* INPUT */

.input-area {
    display: flex;
    gap: 10px;
    padding: 18px;
    background: #172832;
    border-top: 1px solid #30434c;
}

input {
    flex: 1;
    min-width: 0;
    padding: 15px;
    border-radius: 10px;
    border: 1px solid #40515a;
    background: #243640;
    color: white;
    outline: none;
    font-size: 15px;
}

input:focus {
    border-color: #42d392;
}

.send {
    padding: 0 24px;
    border-radius: 10px;
    border: none;
    background: #35b987;
    color: #071b14;
    font-weight: bold;
    cursor: pointer;
}

.send:hover {
    background: #42d392;
}

.send:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

/* DISCLAIMER */

.disclaimer {
    background: #172832;
    text-align: center;
    padding: 9px 12px;
    color: #91a6ad;
    font-size: 11px;
    border-top: 1px solid #30434c;
}

/* MOBILE */

@media(max-width: 650px) {

    .sidebar {
        width: 76px;
        min-width: 76px;
        padding: 10px 7px;
        align-items: center;
    }

    .logo {
        font-size: 12px;
        text-align: center;
        line-height: 1.5;
        margin: 8px 0;
    }

    .new-chat,
    .webkit-btn {
        font-size: 10px;
        text-align: center;
        padding: 12px 4px;
        line-height: 1.5;
    }

    .sidebar-info {
        display: none;
    }

    header {
        padding: 15px 10px;
    }

    .header-title {
        font-size: 15px;
    }

    .model-status {
        font-size: 10px;
    }

    #chat {
        padding: 13px;
    }

    .message {
        max-width: 95%;
    }

    .input-area {
        padding: 10px;
    }

    input {
        padding: 12px;
        font-size: 14px;
    }

    .send {
        padding: 0 15px;
    }

    .welcome h1 {
        font-size: 25px;
    }
}
</style>
</head>

<body>

<!-- SIDEBAR -->

<aside class="sidebar">

    <div class="logo">
        ✦ Galaxy Nova AI
    </div>

    <button class="new-chat" onclick="newChat()">
        ＋ New Chat
    </button>

    <!-- GALAXY WEBKIT BUTTON -->

    <a
        class="webkit-btn"
        href="https://galaxyforte-4.onrender.com"
        target="_blank"
        rel="noopener noreferrer"
    >
        🌌 Galaxy Webkit
    </a>

    <div class="sidebar-info">
        Galaxy Projects<br><br>
        Your AI assistant.
    </div>

</aside>

<!-- MAIN CONTENT -->

<main class="main">

    <header>

        <div class="header-title">
            Galaxy Nova AI
        </div>

        <div class="model-status">
            ● Qwen 2.5
        </div>

    </header>

    <!-- CHAT MESSAGES -->

    <div id="chat">

        <div class="welcome" id="welcome">

            <h1>Welcome to Galaxy Nova AI</h1>

            <p>
                Your personal AI assistant powered by Qwen 2.5.
                Ask questions, explore ideas and write code!
            </p>

        </div>

    </div>

    <!-- INPUT AREA -->

    <div class="input-area">

        <input
            id="prompt"
            type="text"
            placeholder="Message Galaxy Nova AI..."
            autocomplete="off"
        >

        <button
            class="send"
            id="sendBtn"
            onclick="sendMessage()"
        >
            Send
        </button>

    </div>

    <!-- DISCLAIMER -->

    <div class="disclaimer">
        Galaxy Nova AI can make mistakes. Check important information.
    </div>

</main>

<script>

// ======================================
// NOVA AI CHAT SYSTEM
// ======================================

const chat = document.getElementById("chat");

const promptInput = document.getElementById("prompt");

const sendBtn = document.getElementById("sendBtn");

let messages = [];

let busy = false;


// ======================================
// DISPLAY MESSAGE
// ======================================

function addMessage(text, type) {

    document.getElementById("welcome")?.remove();

    const div = document.createElement("div");

    div.className = "message " + type;

    div.textContent = text;

    chat.appendChild(div);

    chat.scrollTop = chat.scrollHeight;

    return div;
}


// ======================================
// SEND MESSAGE TO PYTHON BACKEND
// ======================================

async function sendMessage() {

    const text = promptInput.value.trim();

    if (!text || busy) return;

    promptInput.value = "";

    busy = true;

    sendBtn.disabled = true;

    promptInput.disabled = true;

    messages.push({
        role: "user",
        content: text
    });

    addMessage(text, "user");

    const loading = addMessage(
        "Galaxy Nova AI is thinking...",
        "ai"
    );

    try {

        const response = await fetch("/api/chat", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                messages: messages
            })

        });

        const data = await response.json();

        if (!response.ok) {

            throw new Error(
                data.detail || "Something went wrong."
            );

        }

        if (!data.reply) {

            throw new Error("Empty response from AI.");

        }

        loading.textContent = data.reply;

        messages.push({

            role: "assistant",

            content: data.reply

        });

    }

    catch (error) {

        loading.textContent =
            "Error: " + error.message;

        loading.classList.add("error");

        messages.pop();

    }

    finally {

        busy = false;

        sendBtn.disabled = false;

        promptInput.disabled = false;

        promptInput.focus();

        chat.scrollTop = chat.scrollHeight;

    }

}


// ======================================
// NEW CHAT
// ======================================

function newChat() {

    if (busy) return;

    messages = [];

    chat.innerHTML = `

        <div class="welcome" id="welcome">

            <h1>Welcome to Galaxy Nova AI</h1>

            <p>
                Your personal AI assistant powered by Qwen 2.5.
                Ask questions, explore ideas and write code!
            </p>

        </div>

    `;

    promptInput.focus();

}


// ======================================
// ENTER KEY SUPPORT
// ======================================

promptInput.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            sendMessage();

        }

    }
);

</script>

</body>
</html>
